apiVersion: v1
kind: ConfigMap
metadata:
  name: coach-config
data:
  APP_ENV: production
  AUTH0_ISSUER: https://replace-me.auth0.com/
  AUTH0_AUDIENCE: https://api.ai-learning-coach.example
  HTTP_ADDR: ":8080"
  LOG_FORMAT: json
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4317
  LLM_BASE_URL: http://inference:8000
  LLM_PLANNING_MODEL: planning
  LLM_TEACHING_MODEL: teaching
  LLM_ASSESSMENT_MODEL: assessment
  LLM_INTERVIEW_MODEL: interview
  EMBEDDING_DIMENSIONS: "1024"
  OBJECT_BUCKET: set-by-environment
  AWS_REGION: us-east-1
