apiVersion: apps/v1
kind: Deployment
metadata:
  name: coach-worker
spec:
  replicas: 3
  selector: { matchLabels: { app.kubernetes.io/name: coach-worker } }
  template:
    metadata: { labels: { app.kubernetes.io/name: coach-worker } }
    spec:
      serviceAccountName: coach-worker
      terminationGracePeriodSeconds: 120
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: coach-worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - { configMapRef: { name: coach-config } }
            - { secretRef: { name: coach-runtime } }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "4", memory: 4Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coach-worker
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: coach-worker }
  minReplicas: 3
  maxReplicas: 200
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coach-worker
spec:
  maxUnavailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: coach-worker } }
